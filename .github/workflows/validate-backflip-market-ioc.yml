name: Validate one-shot Back Flip
on:
  push:
    branches:
      - fix/backflip-market-ioc-once
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server build
      - name: Verify Back Flip patch in built source
        run: |
          grep -q 'ETH_420_BACK_FLIP_IOC_LIMIT_PRICE_CENTS = 99' artifacts/api-server/src/lib/strategies/eth420SixStepCandidate.ts
          grep -q 'sourceCandidateOrderId).startsWith("regular:")' artifacts/api-server/src/lib/strategies/eth420SixStepCandidate.ts
          grep -q 'limitPriceCents: crossesAsk ? ETH_420_BACK_FLIP_IOC_LIMIT_PRICE_CENTS' artifacts/api-server/src/lib/strategies/eth420SixStepCandidate.ts
