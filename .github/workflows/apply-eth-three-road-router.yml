name: Apply ETH three-road router patch
on:
  push:
    branches:
      - fix/eth-three-road-router
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Apply ETH three-road router patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eth-three-road-router
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded patch
        run: python3 scripts/apply_eth_three_road_router.py
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Typecheck API
        run: pnpm --filter @workspace/api-server typecheck
      - name: Commit patch
        run: |
          rm .github/workflows/apply-eth-three-road-router.yml scripts/apply_eth_three_road_router.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Route each ETH window to exactly one execution owner"
          git push origin HEAD:fix/eth-three-road-router
