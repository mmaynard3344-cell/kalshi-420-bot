name: Multi-asset G disposable PostgreSQL
on:
  pull_request:
    paths:
      - 'artifacts/btc-shadow/multiAssetG*'
      - '.github/workflows/multi-asset-g-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: g_isolation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/g_isolation_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: psql -h localhost -U postgres -d g_isolation_test -f artifacts/btc-shadow/multiAssetG.sql
      - run: npm install --no-save --ignore-scripts --prefix artifacts/btc-shadow pg@8
      - run: node artifacts/btc-shadow/multiAssetGRealPostgresTest.mjs
