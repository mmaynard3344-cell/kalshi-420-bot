name: tmp-apply-regular-six-step

on:
  push:
    branches: [tmp-regular-six-step-patch-20260907]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-regular-six-step-patch-20260907
          fetch-depth: 0
      - name: Print exact Regular blocks needed for patching
        run: |
          python - <<'PY'
          from pathlib import Path
          specs = [
            ('artifacts/api-server/src/lib/strategies/ethOnlyMartingale.ts', ['Three-step martingale', 'export const ETH_PRINCIPALS_CENTS', 'export function ethPrincipalForStep', 'lossNextStep:']),
            ('artifacts/api-server/src/lib/tradeStore.ts', ['export function isActiveEthMartingaleGeneration', 'export async function advanceEthMartingaleLadderForZeroFill', 'export async function settleEthMartingaleOrder']),
            ('artifacts/api-server/src/routes/trade.ts', ['next_principal_cents:']),
            ('artifacts/api-server/src/lib/strategies/ethOnlyMartingale.test.ts', ['test("ETH uses exactly three principals', 'test("zero-fill win flips side', 'test("zero-fill loss keeps side', 'test("full_fill settlement advances ladder step', 'test("step 1 uses $30 principal', 'test("after three consecutive losses']),
          ]
          for path, needles in specs:
            text = Path(path).read_text()
            print(f'===== {path} =====')
            for needle in needles:
              i = text.find(needle)
              print(f'--- NEEDLE {needle!r} at {i} ---')
              if i >= 0:
                start = max(0, i-500)
                end = min(len(text), i+6000)
                print(text[start:end])
          PY
