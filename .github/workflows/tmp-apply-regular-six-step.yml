name: tmp-apply-regular-six-step

on:
  push:
    branches: [tmp-regular-six-step-patch-20260907]

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-regular-six-step-patch-20260907
          fetch-depth: 0
      - name: Apply exact approved patch intent
        run: |
          cat tmp-patch-ethOnlyMartingale.diff tmp-patch-tradeStore.diff tmp-patch-trade.diff tmp-patch-tests.diff > /tmp/regular-six-step-chronology.patch
          echo "PATCH_BYTES=$(wc -c < /tmp/regular-six-step-chronology.patch)"
          echo "PATCH_SHA256=$(sha256sum /tmp/regular-six-step-chronology.patch | awk '{print $1}')"
          test "$(wc -c < /tmp/regular-six-step-chronology.patch)" -eq 20206
          test "$(sha256sum /tmp/regular-six-step-chronology.patch | awk '{print $1}')" = "9db2c2cd2850fd06f46de9232c6a6a4f6ff766b7d1a7a1c5e8dbabcab763d235"
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/regular-six-step-chronology.patch').read_text()
          lines = p.splitlines(keepends=True)
          i = 0
          touched = []
          while i < len(lines):
              if not lines[i].startswith('diff --git '):
                  i += 1
                  continue
              parts = lines[i].strip().split()
              path = parts[3][2:]
              i += 1
              while i < len(lines) and not lines[i].startswith('@@') and not lines[i].startswith('diff --git '):
                  i += 1
              text = Path(path).read_text()
              while i < len(lines) and not lines[i].startswith('diff --git '):
                  if not lines[i].startswith('@@'):
                      i += 1
                      continue
                  i += 1
                  hunk = []
                  while i < len(lines) and not lines[i].startswith('@@') and not lines[i].startswith('diff --git '):
                      hunk.append(lines[i])
                      i += 1
                  old = ''.join(x[1:] for x in hunk if x.startswith((' ', '-')) and not x.startswith('---'))
                  new = ''.join(x[1:] for x in hunk if x.startswith((' ', '+')) and not x.startswith('+++'))
                  n = text.count(old)
                  if n != 1:
                      raise SystemExit(f'{path}: hunk old text count={n}, expected 1')
                  text = text.replace(old, new, 1)
                  touched.append(path)
              Path(path).write_text(text)
          expected = {
            'artifacts/api-server/src/lib/strategies/ethOnlyMartingale.ts',
            'artifacts/api-server/src/lib/tradeStore.ts',
            'artifacts/api-server/src/routes/trade.ts',
            'artifacts/api-server/src/lib/strategies/ethOnlyMartingale.test.ts',
          }
          if set(touched) != expected:
              raise SystemExit(f'unexpected patched files: {sorted(set(touched))}')
          print('PATCHED_FILES=', sorted(set(touched)))
          PY
          git diff --check
          echo 'CHANGED_FILES:'
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "artifacts/api-server/src/lib/strategies/ethOnlyMartingale.test.ts artifacts/api-server/src/lib/strategies/ethOnlyMartingale.ts artifacts/api-server/src/lib/tradeStore.ts artifacts/api-server/src/routes/trade.ts "
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Full API test suite
        run: pnpm --filter @workspace/api-server test
      - name: Service split isolation tests
        working-directory: artifacts/api-server
        run: node scripts/run-service-split-tests.mjs
      - name: Existing six-step candidate harness
        working-directory: artifacts/api-server
        run: node scripts/run-eth420-six-step-candidate-test.mjs
      - name: Build canonical service-split bundle
        working-directory: artifacts/api-server
        run: node build-service-split.mjs
      - name: Verify Regular source and real built bundle invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('artifacts/api-server/src/lib/strategies/ethOnlyMartingale.ts').read_text()
          ts = Path('artifacts/api-server/src/lib/tradeStore.ts').read_text()
          route = Path('artifacts/api-server/src/routes/trade.ts').read_text()
          bundle = Path('artifacts/api-server/dist/index.mjs').read_text()
          assert 'ETH_PRINCIPALS_CENTS = [1500, 3000, 6000, 12000, 24000, 32000]' in s
          assert 'Math.min(5, step)' in s
          assert 'Math.min(2, step)' not in s
          assert 'lossNextStep: row.martingaleStep >= 5 ? 0 : row.martingaleStep + 1' in s
          assert 'ORDER BY created_at_ms DESC, id DESC' in ts
          assert 'COALESCE(filled_contracts, 0) > 0' in ts
          assert 'FOR UPDATE' in ts
          assert '[1500, 3000, 6000, 12000, 24000, 32000][Math.max(0, Math.min(5, dashboard.state.martingaleStep))]' in route
          compact = bundle.replace(' ', '')
          assert ('[1500,3e3,6e3,12e3,24e3,32e3]' in compact or '[1500,3000,6000,12000,24000,32000]' in compact or '32000' in bundle)
          assert 'Math.min(5' in bundle
          assert 'ORDER BY created_at_ms DESC, id DESC' in bundle
          assert 'COALESCE(filled_contracts, 0) > 0' in bundle
          print('REAL_BUNDLE_REGULAR_SIX_STEP=PASS')
          print('BUNDLE_MATH_MIN_2_COUNT=', bundle.count('Math.min(2'))
          print('BUNDLE_MATH_MIN_5_COUNT=', bundle.count('Math.min(5'))
          PY
      - name: Commit only approved four-file patch to temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tmp-regular-patch.part00 tmp-regular-patch.part01 tmp-regular-patch.part02 tmp-regular-patch.part03 tmp-regular-patch.part04 tmp-regular-patch.part05 tmp-patch-ethOnlyMartingale.diff tmp-patch-tradeStore.diff tmp-patch-trade.diff tmp-patch-tests.diff .github/workflows/tmp-apply-regular-six-step.yml
          git add artifacts/api-server/src/lib/strategies/ethOnlyMartingale.ts artifacts/api-server/src/lib/tradeStore.ts artifacts/api-server/src/routes/trade.ts artifacts/api-server/src/lib/strategies/ethOnlyMartingale.test.ts
          git diff --cached --check
          git commit -m 'Fix Regular ETH six-step chronology'
          git push origin HEAD:tmp-regular-six-step-patch-20260907
