name: Shard transfer unit tests
on:
  push:
    branches:
      - feat/shard-funds-manager-20261017
  pull_request:
    paths:
      - 'artifacts/api-server/src/lib/shardTransfer*'
      - 'artifacts/api-server/scripts/run-shard-transfer-unit-tests.mjs'
      - '.github/workflows/shard-transfer-unit.yml'
jobs:
  shard-transfer-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      SHARD_TRANSFERS_ENABLED: "false"
      SHARD_TRANSFER_TEST_DATABASE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared library types
        run: pnpm typecheck:libs
      - name: Typecheck API server, including transfer routes
        working-directory: artifacts/api-server
        run: pnpm typecheck
      - name: Run pure transfer unit tests (no credentials)
        working-directory: artifacts/api-server
        run: pnpm test:shard-transfers
