name: validate-midnight-carry

on:
  push:
    branches:
      - fix/carry-martingale-across-midnight-v2
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Production API build
        run: pnpm --filter @workspace/api-server run build
      - name: Full workspace typecheck after production patches
        run: pnpm run typecheck
      - name: Assert midnight carry invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path

          regular = Path('artifacts/api-server/src/lib/strategies/ethOnlyMartingale.ts').read_text()
          store = Path('artifacts/api-server/src/lib/tradeStore.ts').read_text()

          assert 'export const ETH_PRINCIPALS_CENTS = [1500, 3000, 6000, 12000, 24000, 32000] as const;' in regular
          assert 'export const ETH_DAILY_LOSS_STOP_CENTS = -120_000;' in regular
          assert '? (isNewDay ? 0 : sequence.realizedPnlCents)' in regular
          assert '? sequence.martingaleStep' in regular
          assert 'requestedSide ?? sequence.side' in regular
          assert '(isNewDay ? 0 : sequence.martingaleStep)' not in regular
          assert '(isNewDay ? "no" : sequence.side)' not in regular

          reserve_start = store.index('export async function reserveEthMartingaleEntry(')
          reserve_end = store.index('/**\n * Durable fence immediately before the exchange POST.', reserve_start)
          reserve = store[reserve_start:reserve_end]
          assert 'spent_cents = CASE WHEN eastern_date = ${params.easternDate} THEN spent_cents + ${cost} ELSE ${cost} END' in reserve
          assert 'realized_pnl_cents = CASE WHEN eastern_date = ${params.easternDate} THEN realized_pnl_cents ELSE 0 END' in reserve
          assert "side = CASE WHEN eastern_date = ${params.easternDate} THEN side ELSE 'no' END" not in reserve
          assert 'martingale_step = CASE WHEN eastern_date = ${params.easternDate} THEN martingale_step ELSE 0 END' not in reserve
          assert 'Sequence side and rung are deliberately untouched across midnight' in reserve
          PY
