name: Verify shadow performance dashboard

on:
  push:
    branches:
      - feature/shadow-performance-dashboard

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/kalshi-reader typecheck
      - run: pnpm --filter @workspace/kalshi-reader build
