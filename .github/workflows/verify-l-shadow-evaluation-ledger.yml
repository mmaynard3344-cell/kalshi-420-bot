name: Verify L shadow evaluation ledger

on:
  push:
    branches:
      - feature/l-shadow-evaluation-ledger

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/api-server typecheck
      - run: pnpm --filter @workspace/api-server build
      - run: pnpm --filter @workspace/api-server test -- --run artifacts/api-server/src/lib/strategies/sweepReclaimV1.test.ts artifacts/api-server/src/lib/strategies/sweepReclaimDryRunRuntime.test.ts
