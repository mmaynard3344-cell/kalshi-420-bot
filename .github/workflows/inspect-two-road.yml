name: validate-two-road
on:
  push:
    branches: [fix/two-road-six-step-jump]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production API build
        run: pnpm --filter @workspace/api-server build
      - name: Assert final two-road source invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          regular = Path('artifacts/api-server/src/lib/strategies/ethOnlyMartingale.ts').read_text()
          store = Path('artifacts/api-server/src/lib/tradeStore.ts').read_text()
          candidate = Path('artifacts/api-server/src/lib/strategies/eth420SixStepCandidate.ts').read_text()
          auto = Path('artifacts/api-server/src/lib/autoTrader.ts').read_text()

          assert 'ETH_PRINCIPALS_CENTS = [1500, 3000, 6000, 12000, 24000, 32000]' in regular
          assert 'ETH_DAILY_LOSS_STOP_CENTS = -120_000' in regular
          assert 'Math.min(5, step)' in regular
          assert 'lossNextStep: row.martingaleStep >= 5 ? 0 : row.martingaleStep + 1' in regular
          assert 'evaluateEthMartingaleWithPrincipal' in regular
          assert store.count('const nextStep = won ? 0 : orderStep >= 5 ? 0 : orderStep + 1;') == 1

          z0 = store.index('export async function advanceEthMartingaleLadderForZeroFill')
          z1 = store.index('/** Fill-evidence repair queue', z0)
          z = store[z0:z1]
          assert 'A zero fill is not a martingale result' in z
          assert 'eth420_candidate_back_flip_overrides' not in z
          assert 'martingale_step=${nextStep}' not in z

          c0 = candidate.index('export async function evaluateAndSubmitEth420CandidateWhenExplicitlyEnabled')
          c1 = candidate.index('async function submitEth420CandidateOrder', c0)
          signal = candidate[c0:c1]
          assert 'jump_martingale_owned' in signal
          assert 'ordinary_martingale_owned' in signal
          assert 'getEth420CandidateBackFlipArm' not in signal
          assert 'submitEth420CandidateOrder' not in signal
          assert 'isEth420CandidateExecutionPermitted()' not in signal

          assert 'evaluateEthMartingaleWithPrincipal(ethState, 42_000)' in auto
          assert 'if (lastReason === "jump_martingale_owned") return "jump";' in auto
          print('two-road invariants passed')
          PY