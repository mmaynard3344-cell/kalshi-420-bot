name: inspect-midnight-carry
on:
  push:
    branches: [fix/continuous-martingale-midnight]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build referenced TypeScript libraries
        run: pnpm exec tsc -b lib/db/tsconfig.json lib/api-zod/tsconfig.json
      - name: Apply production patch chain
        run: pnpm --filter @workspace/api-server build
      - name: Capture only midnight/state seams
        run: |
          python3 - <<'PY' > /tmp/midnight-seams.txt
          from pathlib import Path
          paths=[
            Path('artifacts/api-server/src/lib/strategies/ethOnlyMartingale.ts'),
            Path('artifacts/api-server/src/lib/tradeStore.ts'),
          ]
          terms=('isNewDay','easternDate !==','eastern_date','martingale_step','realized_pnl_cents','reserveEthMartingale','getEthMartingaleState','saveEthMartingaleState')
          for p in paths:
              lines=p.read_text().splitlines()
              print(f'### {p}')
              hits=[]
              for i,l in enumerate(lines):
                  if any(t in l for t in terms): hits.append(i)
              ranges=[]
              for i in hits:
                  a=max(0,i-5); b=min(len(lines),i+12)
                  if ranges and a <= ranges[-1][1]: ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
                  else: ranges.append((a,b))
              for a,b in ranges:
                  for j in range(a,b): print(f'{j+1}: {lines[j]}')
                  print('---')
          PY
          cat /tmp/midnight-seams.txt
      - uses: actions/upload-artifact@v4
        with:
          name: midnight-seams
          path: /tmp/midnight-seams.txt
