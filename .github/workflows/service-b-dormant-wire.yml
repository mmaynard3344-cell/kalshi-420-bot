name: service-b-dormant-wire

on:
  push:
    branches: [service-split-a-b-c]
    paths:
      - .github/workflows/service-b-dormant-wire.yml

permissions:
  contents: write

jobs:
  wire-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: service-split-a-b-c
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply dormant Service B market-loop wiring
        shell: python
        run: |
          from pathlib import Path
          p = Path('artifacts/api-server/src/lib/autoTrader.ts')
          s = p.read_text()
          import_anchor = '''import {
            evaluateAndSubmitEth420CandidateWhenExplicitlyEnabled,
            isEth420CandidateExecutionPermitted,
            observeEth420Candidate,
          } from "./strategies/eth420SixStepCandidate.js";'''
          import_line = 'import { runEthJumpServiceWhenExplicitlyEnabled } from "./strategies/ethJumpLiveRunner.js";'
          if import_line not in s:
              if import_anchor not in s:
                  raise SystemExit('Service B import anchor not found')
              s = s.replace(import_anchor, import_anchor + '\n' + import_line, 1)

          call_anchor = '    await evaluateEth420Candidate(state, _timing);'
          dormant_call = '''    await evaluateEth420Candidate(state, _timing);
            const jumpOpenTimeMs = state.openTime == null ? null : Date.parse(state.openTime);
            await runEthJumpServiceWhenExplicitlyEnabled({
              store: tradeStore,
              market: {
                ticker: state.ticker,
                easternDate: jumpOpenTimeMs != null && Number.isFinite(jumpOpenTimeMs)
                  ? easternDay(new Date(jumpOpenTimeMs)) : easternDay(new Date()),
                observedAtMs: Date.now(),
                floorStrike: state.floorStrike ?? null,
                openTimeMs: jumpOpenTimeMs,
              },
              exchangeIndex: state.exchangeIndex ?? null,
              // Dormant wiring only. A later separately reviewed capital snapshot
              // provider is required before the hard B execution fence can change.
              capital: null,
            });'''
          if 'await runEthJumpServiceWhenExplicitlyEnabled({' not in s:
              if call_anchor not in s:
                  raise SystemExit('Service B call anchor not found')
              s = s.replace(call_anchor, dormant_call, 1)
          p.write_text(s)
      - name: Assert dormant safety invariant
        shell: python
        run: |
          from pathlib import Path
          auto = Path('artifacts/api-server/src/lib/autoTrader.ts').read_text()
          runner = Path('artifacts/api-server/src/lib/strategies/ethJumpLiveRunner.ts').read_text()
          assert 'runEthJumpServiceWhenExplicitlyEnabled' in auto
          assert 'capital: null' in auto
          assert 'export const ETH_JUMP_SERVICE_EXECUTION_APPROVED = false;' in runner
          assert 'ETH_JUMP_SERVICE_EXECUTION_APPROVED = true' not in runner
      - name: Typecheck
        run: pnpm run typecheck
      - name: Run service isolation tests
        working-directory: artifacts/api-server
        run: node scripts/run-service-split-tests.mjs
      - name: Run existing six-step candidate harness
        working-directory: artifacts/api-server
        run: node scripts/run-eth420-six-step-candidate-test.mjs
      - name: Commit verified dormant wiring
        run: |
          if git diff --quiet; then
            echo 'No dormant wiring diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/lib/autoTrader.ts
          git commit -m 'Wire dormant Service B into ETH evaluation loop'
          git push origin HEAD:service-split-a-b-c
