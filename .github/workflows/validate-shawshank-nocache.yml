name: Validate Shawshank no-cache fix
on:
  push:
    branches:
      - ui/grace-api-base
jobs:
  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/kalshi-reader build
      - run: node --check artifacts/kalshi-reader/server.mjs
