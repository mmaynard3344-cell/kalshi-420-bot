name: tmp-lifecycle-baseline-check
on:
  push:
    branches: [tmp-inspect-built-bundle-20260907]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: service-split-a-b-c
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run lifecycle test three times on untouched target
        working-directory: artifacts/api-server
        run: |
          node scripts/run-kalshi-lifecycle-transport-test.mjs
          node scripts/run-kalshi-lifecycle-transport-test.mjs
          node scripts/run-kalshi-lifecycle-transport-test.mjs
