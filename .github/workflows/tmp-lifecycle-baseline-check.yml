name: tmp-lifecycle-baseline-check
on:
  push:
    branches: [tmp-inspect-built-bundle-20260907]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kalshi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d kalshi_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kalshi_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: service-split-a-b-c
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize ephemeral schema
        run: pnpm --filter @workspace/db push-force
      - name: Run lifecycle test three times on untouched target
        working-directory: artifacts/api-server
        run: |
          node scripts/run-kalshi-lifecycle-transport-test.mjs
          node scripts/run-kalshi-lifecycle-transport-test.mjs
          node scripts/run-kalshi-lifecycle-transport-test.mjs
