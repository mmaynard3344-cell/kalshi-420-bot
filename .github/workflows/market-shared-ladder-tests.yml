name: Market shared ladder tests
on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/lib/marketSharedLadder.ts'
      - 'artifacts/api-server/src/lib/marketSharedLadderStore.ts'
      - 'artifacts/api-server/scripts/marketSharedLadder.test.ts'
      - '.github/workflows/market-shared-ladder-tests.yml'
  workflow_dispatch:
jobs:
  ladder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Test pure ladder controller
        run: bun test artifacts/api-server/scripts/marketSharedLadder.test.ts
