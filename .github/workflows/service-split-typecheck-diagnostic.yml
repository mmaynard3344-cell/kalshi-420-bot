name: service-split-typecheck-diagnostic

on:
  push:
    branches: [service-split-a-b-c]
    paths:
      - .github/workflows/service-split-typecheck-diagnostic.yml

permissions:
  contents: read

actions:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: service-split-a-b-c
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture typecheck
        shell: bash
        run: |
          set +e
          pnpm run typecheck > /tmp/typecheck.log 2>&1
          code=$?
          cat /tmp/typecheck.log
          echo $code > /tmp/typecheck.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: service-split-typecheck-diagnostic
          path: |
            /tmp/typecheck.log
            /tmp/typecheck.exit
