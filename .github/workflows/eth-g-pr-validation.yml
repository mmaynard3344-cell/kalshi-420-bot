name: ETH G PR validation
on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/g4060ScalpIndex.ts'
      - 'artifacts/api-server/src/lib/sharedEth*.ts'
      - 'artifacts/api-server/scripts/run-g-shared-latch-regression-test.mjs'
      - '.github/workflows/eth-g-pr-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gtest
          POSTGRES_PASSWORD: gtest_password
          POSTGRES_DB: g_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gtest:gtest_password@localhost:5432/g_validation
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: G shared ladder source regression
        run: node artifacts/api-server/scripts/run-g-shared-latch-regression-test.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: API test suite
        run: pnpm --dir artifacts/api-server test
      - name: Baseline dispatcher integration on main
        if: failure()
        run: |
          git worktree add /tmp/g-main-baseline origin/main
          cd /tmp/g-main-baseline
          pnpm install --frozen-lockfile
          pnpm --dir artifacts/api-server exec node scripts/run-integration-test.mjs
