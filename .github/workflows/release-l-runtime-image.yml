name: Release L runtime image

on:
  push:
    branches:
      - fix/l-dryrun-runtime
    paths:
      - ".release/l-image-trigger"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: ghcr.io/mmaynard3344-cell/kalshi-420-bot-l:dryrun-5f605474
