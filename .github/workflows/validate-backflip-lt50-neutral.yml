name: validate-backflip-lt50-neutral
on:
  push:
    branches:
      - fix/backflip-lt50-neutral-martingale
jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server build
      - name: Verify neutral Back Flip patch reached source
        run: |
          grep -F 'const neutralLt50BackFlip = order.requestedContracts === 50' artifacts/api-server/src/lib/strategies/eth420SixStepCandidate.ts
          grep -F '? transitionState' artifacts/api-server/src/lib/strategies/eth420SixStepCandidate.ts
