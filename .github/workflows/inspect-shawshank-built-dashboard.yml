name: Inspect Shawshank built dashboard
on:
  push:
    branches:
      - ui/grace-api-base
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/kalshi-reader build
      - name: Verify generated dashboard
        run: |
          test -f artifacts/kalshi-reader/dist/public/eth420-dashboard.html
          test -f artifacts/kalshi-reader/dist/public/operations-core.js
          test -f artifacts/kalshi-reader/dist/public/pnl-runtime.js
          grep -q 'operations-core' artifacts/kalshi-reader/dist/public/eth420-dashboard.html
          grep -q 'pnl-runtime' artifacts/kalshi-reader/dist/public/eth420-dashboard.html
          ! grep -q '<script id=' artifacts/kalshi-reader/dist/public/eth420-dashboard.html
          ! grep -q 'data-unified-operations-runtime' artifacts/kalshi-reader/dist/public/eth420-dashboard.html
          test "$(grep -o '<script[^>]*>' artifacts/kalshi-reader/dist/public/eth420-dashboard.html | wc -l)" -eq 2
          node --check artifacts/kalshi-reader/dist/public/operations-core.js
          node --check artifacts/kalshi-reader/dist/public/pnl-runtime.js
          echo '--- final script tags ---'
          grep -o '<script[^>]*>' artifacts/kalshi-reader/dist/public/eth420-dashboard.html
      - uses: actions/upload-artifact@v4
        with:
          name: shawshank-built-dashboard
          path: |
            artifacts/kalshi-reader/dist/public/eth420-dashboard.html
            artifacts/kalshi-reader/dist/public/operations-core.js
            artifacts/kalshi-reader/dist/public/pnl-runtime.js
