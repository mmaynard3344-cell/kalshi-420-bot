name: Build A2 shadow-observability dry-run image

on:
  push:
    branches:
      - feature/a2-shadow-evaluation-ledger

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ghcr.io/mmaynard3344-cell/kalshi-420-bot-a2:exec-dryrun-492c5d09
