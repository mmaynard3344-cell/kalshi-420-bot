name: b-follow-a-side-validation

on:
  push:
    branches: [test/b-follow-a-side-ci]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Run service isolation tests
        working-directory: artifacts/api-server
        run: node scripts/run-service-split-tests.mjs
