name: ETH G authoritative publisher review
on:
  push:
    branches:
      - review/eth-g-published-direction-20261012
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Workspace typecheck
        run: pnpm run typecheck
      - name: Production G build
        run: node artifacts/api-server/build-service-split.mjs
